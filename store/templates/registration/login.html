{% extends "store/base.html" %}

{% block title %}Login — NOVA{% endblock %}

{% block content %}

<section class="auth-section section">

    <div class="auth-card reveal">

        <div class="auth-icon">
            <i class="bi bi-person"></i>
        </div>

        <span>Welcome back</span>

        <h1>
            Sign in to NOVA
        </h1>

        <p>
            Access your orders, wishlist and account.
        </p>

        {% if form.errors %}

        <div class="auth-error">
            <i class="bi bi-exclamation-circle"></i>
            Invalid username or password.
        </div>

        {% endif %}

        <form method="post">

            {% csrf_token %}

            <div class="form-field">

                <label>
                    Username
                </label>

                <input type="text"
                    name="username"
                    autocomplete="username"
                    required
                    autofocus>

            </div>

            <div class="form-field">

                <label>
                    Password
                </label>

                <input type="password"
                    name="password"
                    autocomplete="current-password"
                    required>

            </div>

            <input type="hidden"
                name="next"
                value="{{ next }}">

            <button class="btn btn-primary w-100"
                type="submit">

                Login
                <i class="bi bi-arrow-right"></i>

            </button>

        </form>

    </div>

</section>

{% endblock %}
